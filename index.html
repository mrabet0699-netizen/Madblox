<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Download Roblox Mod</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet" />

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    min-height: 100vh;
    background:
        linear-gradient(rgba(10, 10, 20, 0.75), rgba(10, 10, 20, 0.75)),
        url('https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=1200&q=80')
        no-repeat center center / cover;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: white;
}

.container {
    width: 100%;
    max-width: 400px;
    text-align: center;
    background: rgba(20, 20, 35, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 24px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    animation: fadeIn 0.8s ease;
}

.main-img {
    width: 100%;
    border-radius: 14px;
    display: block;
    margin-bottom: 18px;
}

.badge {
    display: inline-block;
    background: rgba(0, 255, 170, 0.12);
    color: #00ffb3;
    border: 1px solid rgba(0, 255, 170, 0.25);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    margin-bottom: 14px;
}

h1 {
    font-size: 26px;
    line-height: 1.3;
    font-weight: 700;
    margin-bottom: 10px;
}

p {
    font-size: 14px;
    line-height: 1.7;
    color: #d6d6d6;
    margin-bottom: 22px;
}

.download-btn {
    display: block;
    width: 100%;
    padding: 15px;
    background: linear-gradient(45deg, #00ffcc, #00d9ff);
    color: #001018;
    text-decoration: none;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 700;
    box-shadow: 0 0 20px rgba(0, 255, 204, 0.35);
    transition: all 0.3s ease;
}

.download-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 30px rgba(0, 255, 204, 0.55);
}

.note {
    margin-top: 12px;
    font-size: 12px;
    color: #a8a8a8;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(18px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 480px) {
    .container {
        padding: 20px;
    }

    h1 {
        font-size: 22px;
    }

    p {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- Replace this image with your Roblox image -->
    <img
        src="https://i.ibb.co/4ZK3390Q/IMG-1510.jpg"
        alt="Roblox Mod"
        class="main-img"
    />

    <div class="badge">NEW VERSION</div>

    <h1>Blox fruits MOD</h1>

    <p>
       Discover powerful fruits, unlock amazing abilities, battle bosses, and explore vast oceans inspired by the world of One Piece.
    </p>

    <a
        href="https://saveapp.store/cl/i/1x3mxe"
        class="download-btn"
        target="_blank"
        rel="noopener noreferrer"
    >
        Download Now
    </a>

    <div class="note">Fast and secure download.</div>

</div>

</body>
</html>
